name: Build ORBITIDE APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y zip unzip python3-pip libffi-dev libssl-dev
          pip install --upgrade pip
          pip install buildozer cython==0.29.33
      - name: Build APK
        run: |
          yes | buildozer android debug || true
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          SDK="$HOME/.buildozer/android/platform/android-sdk"
          yes | $SDK/cmdline-tools/latest/bin/sdkmanager --licenses || true
          yes | $SDK/cmdline-tools/latest/bin/sdkmanager "build-tools;33.0.2" "platforms;android-33" || true
          buildozer android debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: orbitide-apk
          path: bin/*.apk
